version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mini_erp_postgres
    restart: always
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password_2026
      POSTGRES_DB: mini_erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini_erp_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://erp_user:erp_password_2026@postgres:5432/mini_erp_db?schema=public"
      JWT_SECRET: "mini_erp_crm_super_secret_jwt_key_2026"
      NODE_ENV: "production"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mini_erp_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:

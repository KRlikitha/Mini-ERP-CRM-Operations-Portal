name: Mini ERP + CRM CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Generate Prisma Client & Run DB Push
        run: |
          cd backend
          npx prisma generate
          npx prisma db push

      - name: Seed Test Database
        run: |
          cd backend
          npx ts-node prisma/seed.ts

      - name: Run Backend Business Logic Tests
        run: |
          cd backend
          npm test

      - name: Build Backend TypeScript
        run: |
          cd backend
          npm run build

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend React App
        run: |
          cd frontend
          npm run build
